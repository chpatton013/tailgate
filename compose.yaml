# Tailgate runs the Tailscale client in a container and exposes a SOCKS5 + HTTP
# proxy to the host. Host-side tools reach the tailnet without a VPN client on
# the host.
#
#   docker compose --profile userspace up -d
#   docker compose --profile userspace logs -f tailscale-userspace
#   docker compose --profile userspace exec tailscale-userspace tailscale status
# Or use ./bin/tailgate, which selects the profile from TS_MODE.
#
# Config comes from .env (copy .env.example -> .env first).
#
# TS_MODE in .env selects one mutually exclusive mode. bin/tailgate activates
# the matching `COMPOSE_PROFILES` value:
#   - userspace (default): no TUN/NET_ADMIN. Exposes only a SOCKS5 + HTTP proxy
#     on host loopback. It works under locked-down Docker daemons but reaches
#     only direct tailnet peers, not subnet-router prefixes such as 10.0.0.0/16.
#   - kernel: real `tailscale0` + NET_ADMIN + /dev/net/tun. Docker Desktop
#     grants these inside its Linux VM, not on the host, so it does not create a
#     host VPN interface/profile. EXPERIMENTAL: host-to-container routing may
#     differ from a Linux host on Docker Desktop for Mac. Proxy ports still
#     work.

x-tailscale-common: &tailscale-common
  image: tailgate:${TS_IMAGE_TAG:-stable}
  build:
    context: .
    args:
      GO_IMAGE: ${GO_IMAGE:-public.ecr.aws/docker/library/golang:1.24.13-alpine3.23}
      TAILSCALE_IMAGE: ${TAILSCALE_IMAGE:-ghcr.io/tailscale/tailscale:v1.102.3}
  container_name: tailgate
  hostname: ${TS_HOSTNAME:-tailgate-laptop}
  # Join Docker's existing default bridge instead of creating a dedicated
  # network. tailgate only needs outbound access + loopback-published ports,
  # and this host's daemon scopes default-address-pools to a single /24 that
  # the default bridge already consumes — so a per-project network can't be
  # allocated ("address pools have been fully subnetted").
  network_mode: bridge
  volumes:
    # Persist node identity across rebuilds so Headplane doesn't churn.
    - tailscale-state:/var/lib/tailscale
    # Extra trusted CAs (for example, a corporate SSL-decrypt root).
    # See SSL_CERT_DIR below.
    - ./certs:/certs:ro
  ports:
    # Bound to loopback only — the proxy must never be reachable off-host.
    - "127.0.0.1:${TS_SOCKS5_PORT:-1055}:1055"
    - "127.0.0.1:${TS_HTTP_PROXY_PORT:-1056}:1056"
  # The container needs external DNS to resolve its control-plane host before
  # tailscaled connects. Using 127.0.0.1 here creates a cold-start deadlock.
  # Proxied MagicDNS is independent: the front shim queries Tailscale's
  # internal resolver after registration.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  restart: unless-stopped

# Shared identity, proxy, and control-plane environment.
x-tailscale-env: &tailscale-env
  TS_AUTHKEY: "${TS_AUTHKEY:?set TS_AUTHKEY in .env — run bin/mint-authkey}"
  TS_HOSTNAME: "${TS_HOSTNAME:-tailgate-laptop}"
  TS_EXTRA_ARGS: >-
    --login-server=${TS_LOGIN_SERVER:-https://headscale.example.com}
    ${TS_UP_EXTRA_ARGS:-}
  TS_STATE_DIR: /var/lib/tailscale
  # The DNS-aware shim owns :1055 and delegates resolved destinations to
  # tailscaled's loopback-only SOCKS listener. The HTTP proxy remains on :1056.
  TAILGATE_SOCKS_LISTEN: 0.0.0.0:1055
  TAILGATE_BACKEND_SOCKS_ADDR: 127.0.0.1:1057
  TAILGATE_TAILNET_SUFFIX: ${TAILGATE_TAILNET_SUFFIX:-ts.example.com}
  TS_SOCKS5_SERVER: 127.0.0.1:1057
  # Force relay only when symmetric NAT or policy blocks direct WireGuard.
  # This is a Tailscale debug setting, so the portable default stays false.
  TS_DEBUG_ALWAYS_USE_DERP: "${TS_DEBUG_ALWAYS_USE_DERP:-false}"
  TS_OUTBOUND_HTTP_PROXY_LISTEN: 0.0.0.0:1056
  TS_ENABLE_HEALTH_CHECK: "true"
  # Go reads every cert in this directory in addition to the image's roots.
  # Add a corporate SSL-decrypt root to ./certs when TLS interception causes
  # `x509: certificate signed by unknown authority`. Empty ./certs is harmless.
  SSL_CERT_DIR: /certs

services:
  tailscale-userspace:
    <<: *tailscale-common
    profiles: ["userspace"]
    environment:
      <<: *tailscale-env
      TS_USERSPACE: "true"

  tailscale-kernel:
    <<: *tailscale-common
    profiles: ["kernel"]
    # Real tailscale0 interface — see the note at the top of this file.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      <<: *tailscale-env
      TS_USERSPACE: "false"

volumes:
  tailscale-state:
